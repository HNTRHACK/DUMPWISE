services:
  postgres:
    image: postgres:17
    container_name: dumpwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dumpwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dumpwise_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumpwise -d dumpwise_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
